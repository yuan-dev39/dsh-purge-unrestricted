name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/net-scope.js
          node --check lib/update.js
          node --check client.js
          node --input-type=module -e "import('./lib/net-scope.js').then(()=>console.log('net-scope ok'))"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          zip="dsh-purge-unrestricted-${version}.zip"
          git archive --format=zip --prefix="dsh-purge-unrestricted-${version}/" --output="$zip" HEAD
          test -s "$zip"

          # 魔改客户端补丁包（harness/patch 下的宿主替换文件）
          hzip="harness-patch-${version}.zip"
          ( cd harness && zip -qr "../$hzip" . )
          test -s "$hzip"

          notes="$(mktemp)"
          # release-notes.md 的第一段（到下一个 "# " 标题为止）就是本版说明
          awk 'NR==1{next} /^# /{exit} {print}' release-notes.md > "$notes"
          test -s "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release exists, refreshing notes and assets: $tag"
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "dsh-purge ${version} (unrestricted)" --notes-file "$notes"
          fi
          gh release upload "$tag" "$zip" "$hzip" --clobber
          echo "published https://github.com/${{ github.repository }}/releases/tag/${tag}"
